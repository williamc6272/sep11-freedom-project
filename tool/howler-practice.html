<!DOCTYPE html>
<html>
<head>
<title>Howler Practice</title>
</head>
<body>


<h1>Howler Practice</h1>


<button onclick="sound.play()">Play</button>
<button onclick="sound.pause()">Pause</button>
<button onclick="sound.stop()">Stop</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>


<script>
var sound = new Howl({
  src: ['https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3'],
  volume: 0.5
});
function fadeOut() {
  sound.fade(sound.volume(), 0, 2000);
}

function fadeIn() {
  sound.volume(0);
  sound.play();
  sound.fade(0, 0.5, 2000);
}

function (load){
  sound.volume(0);
  sound.play();
}
</script>


</body>
</html>
